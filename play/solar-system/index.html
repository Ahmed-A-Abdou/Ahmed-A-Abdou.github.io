<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tunable Solar System – Ahmed Alaa</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #02040a; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #02040a; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: rgba(255,255,255,0.75); font: 14px Arial, sans-serif; }
      #bar { width: 240px; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #fff; transition: width 0.2s; }
      #error { color: #ff9b8a; max-width: 420px; text-align: center; line-height: 1.6; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div>Loading the solar system…</div><div id="bar"><div id="fill"></div></div></div>
    <script src="Build/solar-system.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      createUnityInstance(canvas, {
        dataUrl: "Build/solar-system.data.unityweb",
        frameworkUrl: "Build/solar-system.framework.js.unityweb",
        codeUrl: "Build/solar-system.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Ahmed Alaa",
        productName: "Tunable Solar System",
        productVersion: "1.0",
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
        canvas.focus();
      }).catch(function (message) {
        loading.innerHTML = '<div id="error">This demo needs WebGL 2, which this browser or device doesn\'t support.<br><br>' + message + '</div>';
      });
      // Keyboard controls need focus once the player clicks into the frame.
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
